<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the cached theme before first paint to avoid a light flash in dark mode.
      try {
        var p = localStorage.getItem("theme-pref") || "system";
        var dark = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // A custom theme: its computed colours were saved with it (see ThemeProvider), so apply them straight away too.
        if (p === "custom") {
          var c = JSON.parse(localStorage.getItem("theme-custom") || "null");
          if (c && c.vars) {
            document.documentElement.dataset.theme = c.dark ? "dark" : "light";
            for (var k in c.vars) document.documentElement.style.setProperty(k, c.vars[k]);
          }
        }
      } catch (e) {}
      // And the text size, so the page does not jump when the saved size loads.
      try {
        var scale = parseFloat(localStorage.getItem("text-scale") || "");
        if (scale >= 0.85 && scale <= 1.5) document.documentElement.style.setProperty("--text-scale", String(scale));
      } catch (e) {}
      // Same idea for the language: the saved choice, else the browser's first supported language, else English.
      // (Keep the list in sync with LANGUAGES in src/i18n/index.ts.)
      try {
        var supported = ["en", "es"];
        var saved = localStorage.getItem("language-pref");
        var lang = supported.indexOf(saved) >= 0 ? saved : null;
        if (!lang) {
          var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < prefs.length && !lang; i++) {
            var base = String(prefs[i] || "").toLowerCase().split("-")[0];
            if (supported.indexOf(base) >= 0) lang = base;
          }
        }
        document.documentElement.lang = lang || "en";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Simple Bible Memory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
