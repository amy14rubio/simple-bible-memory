<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Someone shared a collection of Bible verses with you. Open it in Simple Bible Memory.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Simple Bible Memory">
<meta property="og:title" content="A Bible memory collection · Una carpeta de versículos">
<meta property="og:description" content="Someone shared a collection of Bible verses with you. · Alguien compartió contigo una carpeta de versículos.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Simple Bible Memory">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="A Bible memory collection · Una carpeta de versículos">
<meta name="twitter:description" content="Someone shared a collection of Bible verses with you. · Alguien compartió contigo una carpeta de versículos.">
<meta name="twitter:image" content="https://simple-bible-memory.web.app/og-image.jpg">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/landing.css?v=202611102142">
<style>
/* The page a shared collection link opens: one centered card of choices, in the landing page's look. */
.share.hero { max-width: 46rem; margin: 0 auto; padding: 5rem var(--gutter) 5rem; text-align: center; } /* a .hero: the landing page's scripture-page background and paper grain (landing.css) */
.share.hero { max-width: none; } /* the title and description may use the width; on a wide screen they are held to 80% of it (below) */
.share h1 { font-family: 'Literata', Georgia, serif; font-weight: 500; font-size: clamp(1.5rem, 6vw, 3.25rem); line-height: 1.15; margin: 0 0 1.75rem; letter-spacing: -0.01em; overflow-wrap: anywhere; text-wrap: pretty; } /* the title runs as wide as the buttons (the landing page balances headings into a narrow block) */
.share .lead { color: var(--muted); font-size: clamp(1rem, 2.6vw, 1.25rem); line-height: 1.55; max-width: none; margin: 0 auto 2.25rem; white-space: pre-line; text-wrap: pretty; }
.share .choices { display: grid; gap: 0.75rem; justify-items: center; }
.share .choices .button, .share .choices .badge { width: 12rem; } /* all three the same width */
.share .choices .button { min-height: 3.75rem; font-size: 1.0625rem; }
.share .choices .store-like { background: #000; color: #fff; border: 1px solid #a6a6a6; border-radius: 0.5rem; gap: 0.6rem; padding: 0 0.8rem; justify-content: flex-start; } /* dressed like the two store badges */
.share .choices .store-like svg { flex-shrink: 0; }
.share .choices .store-like span { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; text-align: left; }
.share .choices .store-like small { font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.02em; }
.share .choices .store-like b { font-size: 1.25rem; white-space: nowrap; font-weight: 600; letter-spacing: -0.01em; }
.share .choices .badge { display: block; }
.share .choices .badge img { display: block; width: 100%; height: auto; }
main { min-height: calc(100vh - 4rem); min-height: calc(100dvh - 4rem); display: flex; flex-direction: column; justify-content: center; } /* the page sits in the middle of the window, not at the top */
@media (max-width: 47.99rem) {
  .share.hero { padding: 4.5rem 2.75rem 4.5rem; } /* a wider margin at the sides: the title and description do not reach the edges */
  .share .choices .button, .share .choices .badge { width: 10.5rem; }
  .share .choices .button { min-height: 3.25rem; }
  .share .choices .store-like b { font-size: 1.05rem; }
  .share .choices .store-like { gap: 0.45rem; padding: 0 0.65rem; }
  .share .choices .store-like svg { width: 24px; height: 24px; }
}
@media (min-width: 48rem) {
  .share h1 { text-wrap: balance; }
  .share .choices .button, .share .choices .badge { width: auto; height: 3.75rem; } /* in a row: the same height (the widths follow each logo) */
  .share .choices .button { min-width: 12rem; padding: 0 1rem; }
  .share .choices .badge img { width: auto; height: 100%; }
  .share.hero { width: 70vw; margin: 0 auto; padding-top: 7.5rem; padding-bottom: 6.5rem; }
  .share .choices { grid-auto-flow: column; justify-content: center; align-items: center; gap: 1rem; } /* the three buttons in one row */
}
@media (min-width: 48rem) and (orientation: portrait) {
  .share.hero { padding-bottom: calc(6.5rem + max(0px, (100vh - 900px) * 0.7)); } /* a tall tablet held upright: the taller the screen, the higher the content sits (the eye looks above the middle) */
}
html, body { overflow-y: clip; } /* the scripture background reaches past the page to fade out; that must not make the page scroll */
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
<a class="brand" href="/"><img src="/logo.svg" alt="" width="32" height="32">Simple Bible Memory</a>
</header>
<main>
<section class="hero share">
<div class="prism" aria-hidden="true"></div>
<h1 id="title">A Bible memory collection</h1>
<p class="lead" id="lead">Someone shared a collection of Bible verses with you.</p>
<div class="choices">
<a class="button store-like" id="open-app" href="#" hidden>Open in the app</a>
<a class="button store-like" id="open-web" href="/app"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5c2.6 2.6 4 5.9 4 9.5s-1.4 6.9-4 9.5c-2.6-2.6-4-5.9-4-9.5s1.4-6.9 4-9.5z"/></svg><span><small id="web-small">Open in your</small><b id="web-big">Web Browser</b></span></a>
<a class="badge" id="play" href="https://play.google.com/store/apps/details?id=app.simplebiblememory"><img id="play-img" src="/badges/play-en.png?v=202611102119" alt="Get it on Google Play" width="574" height="174"></a>
<a class="badge" id="appstore" href="" hidden><img id="appstore-img" src="/badges/appstore-en.svg" alt="Download on the App Store" width="120" height="40"></a>
</div>
</section>
</main>
<script>
(function () {
  var APP_STORE_URL = 'https://apps.apple.com/us/app/simple-bible-memory/id6827304569';
  var PROJECT = 'simple-bible-memory';
  // Turn on once the Android and iPhone apps that understand simplebiblememory:// links are released (until then the button would lead nowhere).
  var APP_LINKS_READY = false;
  var strings = {
    en: { title: 'A Bible memory collection', lead: 'Someone shared a collection of Bible verses with you.', app: 'Open in the app', web: 'Open in your browser', webSmall: 'Open in your', webBig: 'Web Browser', gone: 'This collection can’t be found. It may have been removed.', noApp: 'Don’t have the app yet?', play: 'Get it on Google Play', store: 'Download on the App Store', doc: 'A Bible memory collection · Simple Bible Memory' },
    es: { title: 'Una carpeta para memorizar la Biblia', lead: 'Alguien compartió contigo una carpeta de versículos.', app: 'Abrir en la app', web: 'Abrir en tu navegador', webSmall: 'Abrir en tu', webBig: 'Navegador web', gone: 'No se encuentra esta carpeta. Puede que se haya eliminado.', noApp: '¿Aún no tienes la app?', play: 'Disponible en Google Play', store: 'Descargar en el App Store', doc: 'Una carpeta para memorizar la Biblia · Memoria Bíblica Simple' }
  };
  var lang = /^es/i.test(navigator.language || '') ? 'es' : 'en';
  var t = strings[lang];
  document.documentElement.lang = lang;
  document.title = t.doc;
  var $ = function (id) { return document.getElementById(id); };

  // The collection's id: /d/<id> (the shared link), or ?id=<id> (for testing the page on its own).
  var match = /^\/d\/([^/?#]+)/.exec(location.pathname);
  var id = match ? decodeURIComponent(match[1]) : new URLSearchParams(location.search).get('id');
  var valid = id && /^[A-Za-z0-9_-]{1,128}$/.test(id);

  $('title').textContent = t.title;
  $('lead').textContent = t.lead;
  $('web-small').textContent = t.webSmall; $('web-big').textContent = t.webBig; $('open-web').setAttribute('aria-label', t.web);
  $('play-img').src = '/badges/play-' + lang + '.png?v=202611102119'; $('play-img').alt = t.play;
  $('appstore-img').src = '/badges/appstore-' + lang + '.svg'; $('appstore-img').alt = t.store;
  if (APP_STORE_URL) { $('appstore').href = APP_STORE_URL; $('appstore').hidden = false; }

  var phone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (!valid) { $('lead').textContent = t.gone; $('open-web').hidden = true; $('open-app').hidden = true; return; }
  $('open-web').href = '/app#/discover/' + encodeURIComponent(id);
  if (phone && APP_LINKS_READY) { $('open-app').textContent = t.app; $('open-app').href = 'simplebiblememory://discover/' + encodeURIComponent(id); $('open-app').hidden = false; }
  // Android phones and iPhones that have the app do not need the store buttons first, but they stay below for everyone else.

  // The collection's name and size, read from the public catalogue (anyone may read it). If that fails, the page still works.
  fetch('https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/publicDecks/' + encodeURIComponent(id))
    .then(function (r) { return r.ok ? r.json() : r.status === 404 ? { gone: true } : Promise.reject(); })
    .then(function (d) {
      var f = d.fields;
      if (d.gone || !f || (f.hidden && f.hidden.booleanValue === true)) { $('lead').textContent = t.gone; $('open-app').hidden = true; $('open-web').hidden = true; return; }
      if (f.title && f.title.stringValue) { $('title').textContent = f.title.stringValue; document.title = f.title.stringValue + ' · Simple Bible Memory'; }
      // The collection's own description, if it has one (otherwise the line above stays).
      if (f.description && f.description.stringValue) $('lead').textContent = f.description.stringValue;
    })
    .catch(function () {});
})();
</script>
</body>
</html>
